name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      expected-default-sha:
        description: Exact default-branch commit requested after a checked merge
        type: string
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: edbfi/automation/actions/dispatch-guard@v1.1.1
        with:
          token: ${{ github.token }}
          expected-default-sha: ${{ inputs.expected-default-sha }}
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main" > /tmp/runs.json
          python3 - <<'PYTHON'
          import json, os
          runs = json.load(open('/tmp/runs.json'))['workflow_runs']
          final = next((r for r in runs if r['event'] in {'push', 'workflow_dispatch'}), None)
          if not (final and final['head_sha'] == os.environ['GITHUB_SHA'] and final['head_branch'] == 'main' and final['status'] == 'completed' and final['conclusion'] == 'success'):
              raise SystemExit('Exact main commit has no successful final CI')
          PYTHON
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - uses: edbfi/automation/actions/dispatch-guard@v1.1.1
        with:
          token: ${{ github.token }}
          expected-default-sha: ${{ inputs.expected-default-sha }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: guides.edb.fi
