name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected-default-sha:
        description: Exact default-branch commit to publish; empty uses current main
        type: string
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: deploy-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current deployment revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Require successful CI for this exact default commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/deployment.py

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Recheck current revision and CI before publication
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CI_RUN_ID: ${{ steps.ci.outputs.run-id }}
          EXPECTED_CI_ATTEMPT: ${{ steps.ci.outputs.run-attempt }}
        run: python3 .github/scripts/deployment.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: guides.edb.fi
