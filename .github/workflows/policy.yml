name: PR policy
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review, converted_to_draft, review_requested, review_request_removed]
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions:
  contents: read
  pull-requests: read
  actions: write
jobs:
  policy:
    # Pilot only: the unreleased v4 policy action, pinned to d303390674407256c10bcd92b2a40bf9c70c4c37.
    name: policy / ci / policy
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/pr-policy@d303390674407256c10bcd92b2a40bf9c70c4c37
        with:
          token: ${{ github.token }}
