name: smoke
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  smoke:
    name: serve and verify published routes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.14'
    - uses: actions/download-artifact@v8.0.1
      with:
        name: site-dist
        path: dist/
    - run: bash .github/scripts/smoke.sh
    - name: Reject tracked-file mutations
      run: git diff --exit-code HEAD
